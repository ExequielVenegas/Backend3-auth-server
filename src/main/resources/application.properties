spring.application.name=auth-server
server.port=${SERVER_PORT:9000}
auth.issuer=${AUTH_ISSUER:http://localhost:9000}
auth.web-client-secret=${AUTH_WEB_CLIENT_SECRET}
auth.mobile-client-secret=${AUTH_MOBILE_CLIENT_SECRET}
auth.atm-client-secret=${AUTH_ATM_CLIENT_SECRET}
auth.signing-key-store=${AUTH_SIGNING_KEY_STORE:file:../secrets/auth-signing.p12}
auth.signing-key-password=${AUTH_KEYSTORE_PASSWORD}
management.endpoints.web.exposure.include=health
server.shutdown=graceful
